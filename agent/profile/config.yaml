model:
  provider: custom:local-llm
  default: operator
  context_length: 262144
  max_tokens: 16384
fallback_providers:
  - provider: ollama-fallback
    model: FALLBACK_MODEL
custom_providers:
  - name: local-llm
    base_url: http://127.0.0.1:4000/v1
    api_key: ''
    api_mode: chat_completions
    models:
      operator:
        context_length: 262144
        max_tokens: 16384
        supports_vision: false
  - name: ollama-fallback
    base_url: http://OLLAMA_HOST:11434/v1
    api_key: ''
    api_mode: chat_completions
    models:
      FALLBACK_MODEL:
        context_length: 65536
        supports_vision: false
toolsets: []
agent:
  max_turns: 20
  image_input_mode: "text"
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - skills
    - todo
    - kanban
    - memory
    - context_engine
    - session_search
    - connections
    - clarify
    - delegation
    - cronjob
    - yuanbao
    - computer_use
    - a2a
discord:
  allow_any_attachment: false
  max_attachment_bytes: 1
gateway:
  trust_recent_files: false
mcp_servers:
  smh:
    command: "HERMES_PYTHON"
    args: ["SMH_DIR/agent/server.py"]
    env:
      SMH_CF_API_KEY: "${SMH_CF_API_KEY}"
      SMH_RELAY_URL: "${SMH_RELAY_URL}"
      SMH_AGENT_TOKEN: "${SMH_AGENT_TOKEN}"
